# /etc/nginx/sites-available/supervisao.conf
# Proxy reverso com HTTPS na rede interna. Certificado emitido pela CA interna
# da empresa (ou autoassinado distribuído às máquinas da equipe).

server {
    listen 80;
    server_name supervisao.empresa.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name supervisao.empresa.local;

    ssl_certificate     /etc/ssl/supervisao/supervisao.crt;
    ssl_certificate_key /etc/ssl/supervisao/supervisao.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Restrinja à rede interna e à faixa da VPN
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    allow 172.16.0.0/12;
    deny all;

    client_max_body_size 12m;   # anexos até 10 MB
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Substitui (não acrescenta) para impedir falsificação do IP pelo cliente
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
